# OTA 灰度升级配置
# 离线阈值：超过该时长未收到心跳即判定 OFFLINE
ota.offline-threshold-ms=30000
# 批次成功阈值（台数）：当前批成功数达到该值才允许进入下一批
ota.batch-success-threshold=2
# 最大失败率（0~1）：FAILED/(SUCCESS+FAILED) 超过该值任务暂停
ota.max-failure-rate=0.5
# 默认每批设备数
ota.batch-size=3
# 批次达标判定方式：COUNT=按固定成功台数（历史默认，行为不变）；RATIO=按当前批成功设备占比判定（尾巴批次设备较少时也能正常达标）
#ota.batch-success-mode=COUNT
# RATIO 模式下当前批达标所需的最小成功占比（0~1），仅 batch-success-mode=RATIO 时生效
#ota.batch-success-ratio=1.0
# 每台设备最大尝试次数（首次上报+重试）；0 或不配置表示不限制（历史行为），达到上限后失败设备自动回滚
#ota.max-attempts-per-device=0
